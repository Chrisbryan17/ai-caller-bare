name: Apply Final Resolved Live Loss Ledger

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

concurrency:
  group: apply-final-resolved-live-loss-ledger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact reviewed live-ledger patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-live-ledger.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          for field in [
              'suspension_reason: None,',
              'live_resolved: 0,',
              'live_wins: 0,',
              'live_losses: 0,',
              'live_net_pnl: Decimal::ZERO,',
              'live_peak_pnl: Decimal::ZERO,',
              'live_max_drawdown: Decimal::ZERO,',
              'live_consecutive_losses: 0,',
              'live_outcomes: Vec::new(),',
          ]:
              script = script.replace(f'\n        {field}', f'\n            {field}')
          script = script.replace(
              "'''            counts_global,\n        fill,\n    });'''",
              "'''            counts_global,\n            fill,\n        });'''",
          )
          script = script.replace(
              "'''            counts_global,\n        live: false,\n        fill,\n    });'''",
              "'''            counts_global,\n            live: false,\n            fill,\n        });'''",
          )
          Path('/tmp/apply_live_ledger.py').write_text(script + '\n')
          PY
          set -o pipefail
          python /tmp/apply_live_ledger.py 2>&1 | tee /tmp/live-ledger-v3.log
          cargo fmt --all 2>&1 | tee -a /tmp/live-ledger-v3.log
      - name: Run focused live-ledger regression tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --test live_suspension --test runtime_rotation --test registry --test journal_rotation --test launch 2>&1 | tee -a /tmp/live-ledger-v3.log
      - name: Commit verified live-ledger source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'feat: persist and enforce resolved live-loss suspension'
          git push origin HEAD:polymarket-copybot-final-20260716-done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-live-ledger-diagnostics
          path: /tmp/live-ledger-v3.log
          if-no-files-found: warn
