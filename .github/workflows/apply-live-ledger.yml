name: Apply Resolved Live Loss Ledger

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

concurrency:
  group: apply-resolved-live-loss-ledger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Implement persisted live outcome accounting
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {count}')
              return updated

          path = Path('src/registry.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '''pub struct PaperOutcome {
              pub condition_id: String,
              pub resolved_epoch: i64,
              pub pnl: Decimal,
              pub won: bool,
          }
          ''',
              '''pub struct PaperOutcome {
              pub condition_id: String,
              pub resolved_epoch: i64,
              pub pnl: Decimal,
              pub won: bool,
          }

          #[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]
          pub struct LiveOutcome {
              pub condition_id: String,
              pub resolved_epoch: i64,
              pub pnl: Decimal,
              pub won: bool,
          }
          ''',
              'live outcome type',
          )
          text = replace_once(
              text,
              '''    pub paper_outcomes: Vec<PaperOutcome>,
              pub suspension_reason: Option<SuspensionReason>,''',
              '''    pub paper_outcomes: Vec<PaperOutcome>,
              #[serde(default)]
              pub live_resolved: usize,
              #[serde(default)]
              pub live_wins: usize,
              #[serde(default)]
              pub live_losses: usize,
              #[serde(default)]
              pub live_net_pnl: Decimal,
              #[serde(default)]
              pub live_peak_pnl: Decimal,
              #[serde(default)]
              pub live_max_drawdown: Decimal,
              #[serde(default)]
              pub live_consecutive_losses: usize,
              #[serde(default)]
              pub live_outcomes: Vec<LiveOutcome>,
              pub suspension_reason: Option<SuspensionReason>,''',
              'live ledger fields',
          )
          text = replace_once(
              text,
              '''            paper_outcomes: Vec::new(),
                  suspension_reason: None,''',
              '''            paper_outcomes: Vec::new(),
                  live_resolved: 0,
                  live_wins: 0,
                  live_losses: 0,
                  live_net_pnl: Decimal::ZERO,
                  live_peak_pnl: Decimal::ZERO,
                  live_max_drawdown: Decimal::ZERO,
                  live_consecutive_losses: 0,
                  live_outcomes: Vec::new(),
                  suspension_reason: None,''',
              'live ledger initialization',
          )
          text = replace_once(
              text,
              '''    pub fn refresh_qualification(&mut self, wallet: &str, now: i64) -> Result<bool> {''',
              '''    pub fn record_live_outcome(&mut self, wallet: &str, outcome: LiveOutcome) -> Result<bool> {
                  let bankroll = self.state.bankroll;
                  let normalized = wallet.to_ascii_lowercase();
                  let suspension = {
                      let record = self.record_mut(&normalized).ok_or_else(|| {
                          CopybotError::InvalidConfiguration("live outcome wallet is unknown".into())
                      })?;
                      if record
                          .live_outcomes
                          .iter()
                          .any(|existing| existing.condition_id == outcome.condition_id)
                      {
                          return Ok(false);
                      }
                      record.live_resolved += 1;
                      record.live_net_pnl += outcome.pnl;
                      record.live_peak_pnl = record.live_peak_pnl.max(record.live_net_pnl);
                      record.live_max_drawdown = record
                          .live_max_drawdown
                          .max(record.live_peak_pnl - record.live_net_pnl);
                      if outcome.won {
                          record.live_wins += 1;
                          record.live_consecutive_losses = 0;
                      } else {
                          record.live_losses += 1;
                          record.live_consecutive_losses += 1;
                      }
                      record.live_outcomes.push(outcome);
                      let reason = if record.live_consecutive_losses >= 2 {
                          Some(SuspensionReason::ConsecutiveLosses)
                      } else if record.live_max_drawdown > bankroll * dec!(0.05) {
                          Some(SuspensionReason::Drawdown)
                      } else {
                          None
                      };
                      if let Some(reason) = reason.clone() {
                          record.lifecycle = WalletLifecycle::Suspended;
                          record.suspension_reason = Some(reason);
                      }
                      reason
                  };
                  if suspension.is_some() {
                      let before = self.state.active_wallets.len();
                      self.state
                          .active_wallets
                          .retain(|active| !active.eq_ignore_ascii_case(&normalized));
                      if self.state.active_wallets.len() != before {
                          self.state.active_set_generation += 1;
                      }
                  }
                  Ok(suspension.is_some())
              }

              pub fn refresh_qualification(&mut self, wallet: &str, now: i64) -> Result<bool> {''',
              'live outcome accounting method',
          )
          path.write_text(text)

          path = Path('src/runtime.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '''    DynamicWatcherSet, ExecutionFill, LaunchController, MarketResolution, PaperOutcome, Result,
              RotationContext, Trade, WalletLifecycle, WalletRegistry, WatcherSpec,''',
              '''    DynamicWatcherSet, ExecutionFill, LaunchController, LiveOutcome, MarketResolution,
              PaperOutcome, Result, RotationContext, Trade, WalletLifecycle, WalletRegistry,
              WatcherSpec,''',
              'runtime live outcome import',
          )
          text = replace_once(
              text,
              '''    pub counts_global: bool,
              pub fill: ExecutionFill,''',
              '''    pub counts_global: bool,
              #[serde(default)]
              pub live: bool,
              pub fill: ExecutionFill,''',
              'tracked position mode',
          )
          text = replace_once(
              text,
              '''    pub counts_global: bool,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]''',
              '''    pub counts_global: bool,
              pub live: bool,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]''',
              'resolution record mode',
          )
          text = replace_once(
              text,
              '''            counts_global,
                  fill,
              });''',
              '''            counts_global,
                  live: false,
                  fill,
              });''',
              'paper position mode',
          )
          text = replace_once(
              text,
              '''    pub fn due_condition_ids(&self, now: i64) -> Vec<String> {''',
              '''    pub fn track_live_fill(
                  &mut self,
                  wallet: &str,
                  market_end_epoch: i64,
                  fill: ExecutionFill,
              ) -> Result<()> {
                  if fill.paper {
                      return Err(CopybotError::InvalidConfiguration(
                          "live position cannot contain a paper fill".into(),
                      ));
                  }
                  let wallet = wallet.to_ascii_lowercase();
                  if self.positions.iter().any(|position| {
                      position.wallet == wallet && position.fill.condition_id == fill.condition_id
                  }) {
                      return Ok(());
                  }
                  self.positions.push(PaperPosition {
                      wallet,
                      market_end_epoch,
                      counts_global: false,
                      live: true,
                      fill,
                  });
                  self.positions.sort_by(|left, right| {
                      (left.market_end_epoch, &left.wallet, &left.fill.condition_id).cmp(&(
                          right.market_end_epoch,
                          &right.wallet,
                          &right.fill.condition_id,
                      ))
                  });
                  self.save_runtime_state()
              }

              pub fn due_condition_ids(&self, now: i64) -> Vec<String> {''',
              'live fill tracking',
          )
          text = sub_once(
              text,
              r'    pub fn resolve_paper\(.*?\n    \}\n\n    fn synchronize_watchers',
              '''    pub fn resolve_positions(
                  &mut self,
                  resolutions: &HashMap<String, MarketResolution>,
                  now: i64,
              ) -> Result<Vec<PaperResolutionRecord>> {
                  let mut remaining = Vec::new();
                  let mut resolved = Vec::new();
                  for position in self.positions.drain(..) {
                      let Some(resolution) = resolutions.get(&position.fill.condition_id) else {
                          remaining.push(position);
                          continue;
                      };
                      let Some(winner) = resolution.winner else {
                          remaining.push(position);
                          continue;
                      };
                      if !resolution.closed {
                          remaining.push(position);
                          continue;
                      }
                      let won = position.fill.outcome == winner;
                      let pnl = if won {
                          position.fill.shares - position.fill.total_cost
                      } else {
                          -position.fill.total_cost
                      };
                      if position.live {
                          self.registry.record_live_outcome(
                              &position.wallet,
                              LiveOutcome {
                                  condition_id: position.fill.condition_id.clone(),
                                  resolved_epoch: now,
                                  pnl,
                                  won,
                              },
                          )?;
                      } else {
                          self.registry.record_paper_outcome(
                              &position.wallet,
                              PaperOutcome {
                                  condition_id: position.fill.condition_id.clone(),
                                  resolved_epoch: now,
                                  pnl,
                                  won,
                              },
                          )?;
                          self.registry.refresh_qualification(&position.wallet, now)?;
                          if position.counts_global {
                              self.launch_controller.record_resolved(pnl, won);
                          }
                      }
                      resolved.push(PaperResolutionRecord {
                          wallet: position.wallet,
                          condition_id: position.fill.condition_id,
                          resolved_epoch: now,
                          won,
                          pnl,
                          counts_global: position.counts_global,
                          live: position.live,
                      });
                  }
                  self.positions = remaining;
                  self.synchronize_watchers()?;
                  self.registry.save_atomic()?;
                  self.save_runtime_state()?;
                  Ok(resolved)
              }

              pub fn resolve_paper(
                  &mut self,
                  resolutions: &HashMap<String, MarketResolution>,
                  now: i64,
              ) -> Result<Vec<PaperResolutionRecord>> {
                  self.resolve_positions(resolutions, now)
              }

              fn synchronize_watchers''',
              'mixed paper and live resolution',
          )
          path.write_text(text)

          path = Path('src/journal.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '''    PaperResolved {
                  observed_epoch: i64,
                  wallet: String,
                  condition_id: String,
                  won: bool,
                  pnl: Decimal,
                  counts_global: bool,
                  active_set_generation: u64,
              },''',
              '''    PaperResolved {
                  observed_epoch: i64,
                  wallet: String,
                  condition_id: String,
                  won: bool,
                  pnl: Decimal,
                  counts_global: bool,
                  active_set_generation: u64,
              },
              LiveResolved {
                  observed_epoch: i64,
                  wallet: String,
                  condition_id: String,
                  won: bool,
                  pnl: Decimal,
                  active_set_generation: u64,
              },''',
              'live resolution journal record',
          )
          path.write_text(text)

          path = Path('src/app_support.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '''    let records = runtime.resolve_paper(&resolutions, now)?;
              for record in records {
                  journal
                      .append(&JournalRecord::PaperResolved {
                          observed_epoch: now,
                          wallet: record.wallet,
                          condition_id: record.condition_id,
                          won: record.won,
                          pnl: record.pnl,
                          counts_global: record.counts_global,
                          active_set_generation: runtime.registry().state().active_set_generation,
                      })
                      .await?;
              }
              journal_lifecycle_changes(now, &before, runtime, "forward_paper_resolution", journal).await?;''',
              '''    let records = runtime.resolve_positions(&resolutions, now)?;
              for record in records {
                  let generation = runtime.registry().state().active_set_generation;
                  if record.live {
                      journal
                          .append(&JournalRecord::LiveResolved {
                              observed_epoch: now,
                              wallet: record.wallet,
                              condition_id: record.condition_id,
                              won: record.won,
                              pnl: record.pnl,
                              active_set_generation: generation,
                          })
                          .await?;
                  } else {
                      journal
                          .append(&JournalRecord::PaperResolved {
                              observed_epoch: now,
                              wallet: record.wallet,
                              condition_id: record.condition_id,
                              won: record.won,
                              pnl: record.pnl,
                              counts_global: record.counts_global,
                              active_set_generation: generation,
                          })
                          .await?;
                  }
              }
              journal_lifecycle_changes(now, &before, runtime, "position_resolution", journal).await?;''',
              'mixed resolution journaling',
          )
          text = replace_once(
              text,
              '''            if fill.paper {
                      runtime.track_paper_fill(&wallet, end, true, fill.clone())?;
                  }
                  *open = Some((fill.condition_id, end));''',
              '''            if fill.paper {
                      runtime.track_paper_fill(&wallet, end, true, fill.clone())?;
                  } else {
                      runtime.track_live_fill(&wallet, end, fill.clone())?;
                  }
                  *open = Some((fill.condition_id, end));''',
              'live fill runtime wiring',
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Run focused live-ledger regression tests
        run: cargo test --test live_suspension --test runtime_rotation --test registry --test journal_rotation --test launch
      - name: Commit verified live-ledger source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'feat: persist and enforce resolved live-loss suspension'
          git push origin HEAD:polymarket-copybot-final-20260716-done
