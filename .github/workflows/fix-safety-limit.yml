name: Correct Safety Fix Gamma Limit

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - name: Correct fixed resolution limit
        shell: bash
        run: |
          perl -0pi -e 's/chunk\.len\(\)\.to_string\(\)/"50".into()/g' .github/workflows/apply-safety-fixes.yml
          grep -F '("limit", "50".into()),' .github/workflows/apply-safety-fixes.yml
          git diff --exit-code -- .github/workflows/apply-safety-fixes.yml && {
            echo 'No correction was applied.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-safety-fixes.yml
          git commit -m 'ci: use fixed Gamma resolution page limit'
          git push origin HEAD:polymarket-copybot-final-20260716-done
