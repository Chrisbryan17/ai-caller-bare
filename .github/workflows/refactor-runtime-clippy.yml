name: Refactor Runtime Clippy

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Refactor feature-gated helpers and active signal context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          support = Path('src/app_support.rs')
          text = support.read_text()
          text = text.replace(
              '    JournalRecord, JsonlJournal, MarketResolution, PositionSizer, PreflightStatus, RiskArbiter,\n'
              '    RotationContext, RotationRuntime, SizingConfig, WalletLifecycle, conservative_cent_price,\n',
              '    JournalRecord, JsonlJournal, MarketResolution, PositionSizer, RiskArbiter, RotationContext,\n'
              '    RotationRuntime, SizingConfig, WalletLifecycle, conservative_cent_price,\n',
          )
          text = text.replace(
              'use crate::app::AppConfig;\n',
              'use crate::app::AppConfig;\n\n'
              '#[cfg(feature = "live-trading")]\n'
              'use polymarket_copybot::PreflightStatus;\n\n'
              'pub(crate) struct ActiveSignalContext<\'a> {\n'
              '    pub config: &\'a AppConfig,\n'
              '    pub risk: &\'a mut RiskArbiter,\n'
              '    pub journal: &\'a JsonlJournal,\n'
              '    pub runtime: &\'a mut RotationRuntime,\n'
              '    pub open: &\'a mut Option<(String, i64)>,\n'
              '}\n',
          )
          old_signature = '''pub(crate) async fn process_active_signal<E: Executor + ?Sized>(
              config: &AppConfig,
              now: i64,
              signal: CandidateSignal,
              risk: &mut RiskArbiter,
              executor: &E,
              journal: &JsonlJournal,
              runtime: &mut RotationRuntime,
              open: &mut Option<(String, i64)>,
          ) -> Result<()> {
          '''
          new_signature = '''pub(crate) async fn process_active_signal<E: Executor + ?Sized>(
              now: i64,
              signal: CandidateSignal,
              executor: &E,
              context: ActiveSignalContext<'_>,
          ) -> Result<()> {
              let ActiveSignalContext {
                  config,
                  risk,
                  journal,
                  runtime,
                  open,
              } = context;
          '''
          if old_signature not in text:
              raise SystemExit('active signal signature did not match')
          text = text.replace(old_signature, new_signature)
          text = text.replace(
              'pub(crate) fn log_preflight(preflight: &PreflightStatus) {',
              '#[cfg(feature = "live-trading")]\n'
              'pub(crate) fn log_preflight(preflight: &PreflightStatus) {',
          )
          support.write_text(text)

          app = Path('src/app.rs')
          text = app.read_text()
          text = text.replace(
              'use crate::app_support::{\n'
              '    apply_discovery_result, apply_paper_resolutions, epoch, log_preflight, millis_to_seconds,\n'
              '    process_active_signal, process_shadow_signal, retry_after_map,\n'
              '};\n',
              '#[cfg(feature = "live-trading")]\n'
              'use crate::app_support::log_preflight;\n\n'
              'use crate::app_support::{\n'
              '    ActiveSignalContext, apply_discovery_result, apply_paper_resolutions, epoch, millis_to_seconds,\n'
              '    process_active_signal, process_shadow_signal, retry_after_map,\n'
              '};\n',
          )
          old_paper = '''                    process_active_signal(
                              &config,
                              now,
                              signal,
                              &mut risk,
                              &paper_executor,
                              &journal,
                              &mut runtime,
                              &mut open,
                          )
          '''
          new_paper = '''                    process_active_signal(
                              now,
                              signal,
                              &paper_executor,
                              ActiveSignalContext {
                                  config: &config,
                                  risk: &mut risk,
                                  journal: &journal,
                                  runtime: &mut runtime,
                                  open: &mut open,
                              },
                          )
          '''
          if old_paper not in text:
              raise SystemExit('paper execution call did not match')
          text = text.replace(old_paper, new_paper)
          old_live = '''                        process_active_signal(
                                  &config,
                                  now,
                                  signal,
                                  &mut risk,
                                  executor,
                                  &journal,
                                  &mut runtime,
                                  &mut open,
                              )
          '''
          new_live = '''                        process_active_signal(
                                  now,
                                  signal,
                                  executor,
                                  ActiveSignalContext {
                                      config: &config,
                                      risk: &mut risk,
                                      journal: &journal,
                                      runtime: &mut runtime,
                                      open: &mut open,
                                  },
                              )
          '''
          if old_live not in text:
              raise SystemExit('live execution call did not match')
          text = text.replace(old_live, new_live)
          app.write_text(text)
          PY
          cargo fmt --all
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.rs src/app_support.rs
          git commit -m 'refactor: group active execution state'
          git push origin HEAD:polymarket-copybot-final-20260716-done
