name: Refactor Runtime Clippy

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Refactor feature-gated helpers and active signal context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          support = Path('src/app_support.rs')
          text = support.read_text()
          text = text.replace(
              '    JournalRecord, JsonlJournal, MarketResolution, PositionSizer, PreflightStatus, RiskArbiter,\n'
              '    RotationContext, RotationRuntime, SizingConfig, WalletLifecycle, conservative_cent_price,\n',
              '    JournalRecord, JsonlJournal, MarketResolution, PositionSizer, RiskArbiter, RotationContext,\n'
              '    RotationRuntime, SizingConfig, WalletLifecycle, conservative_cent_price,\n',
          )
          if 'pub(crate) struct ActiveSignalContext' not in text:
              text = text.replace(
                  'use crate::app::AppConfig;\n',
                  'use crate::app::AppConfig;\n\n'
                  '#[cfg(feature = "live-trading")]\n'
                  'use polymarket_copybot::PreflightStatus;\n\n'
                  'pub(crate) struct ActiveSignalContext<\'a> {\n'
                  '    pub config: &\'a AppConfig,\n'
                  '    pub risk: &\'a mut RiskArbiter,\n'
                  '    pub journal: &\'a JsonlJournal,\n'
                  '    pub runtime: &\'a mut RotationRuntime,\n'
                  '    pub open: &\'a mut Option<(String, i64)>,\n'
                  '}\n',
              )
          pattern = re.compile(
              r'pub\(crate\) async fn process_active_signal<E: Executor \+ \?Sized>\(.*?\n\) -> Result<\(\)> \{\n',
              re.S,
          )
          replacement = '''pub(crate) async fn process_active_signal<E: Executor + ?Sized>(
              now: i64,
              signal: CandidateSignal,
              executor: &E,
              context: ActiveSignalContext<'_>,
          ) -> Result<()> {
              let ActiveSignalContext {
                  config,
                  risk,
                  journal,
                  runtime,
                  open,
              } = context;
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'active signal signature replacements={count}')
          if '#[cfg(feature = "live-trading")]\npub(crate) fn log_preflight' not in text:
              text = text.replace(
                  'pub(crate) fn log_preflight(preflight: &PreflightStatus) {',
                  '#[cfg(feature = "live-trading")]\n'
                  'pub(crate) fn log_preflight(preflight: &PreflightStatus) {',
              )
          support.write_text(text)

          app = Path('src/app.rs')
          text = app.read_text()
          text = text.replace(
              'use crate::app_support::{\n'
              '    apply_discovery_result, apply_paper_resolutions, epoch, log_preflight, millis_to_seconds,\n'
              '    process_active_signal, process_shadow_signal, retry_after_map,\n'
              '};\n',
              '#[cfg(feature = "live-trading")]\n'
              'use crate::app_support::log_preflight;\n\n'
              'use crate::app_support::{\n'
              '    ActiveSignalContext, apply_discovery_result, apply_paper_resolutions, epoch, millis_to_seconds,\n'
              '    process_active_signal, process_shadow_signal, retry_after_map,\n'
              '};\n',
          )
          paper_pattern = re.compile(
              r'process_active_signal\(\s*&config,\s*now,\s*signal,\s*&mut risk,\s*&paper_executor,\s*&journal,\s*&mut runtime,\s*&mut open,\s*\)',
              re.S,
          )
          paper_replacement = '''process_active_signal(
              now,
              signal,
              &paper_executor,
              ActiveSignalContext {
                  config: &config,
                  risk: &mut risk,
                  journal: &journal,
                  runtime: &mut runtime,
                  open: &mut open,
              },
          )'''
          text, paper_count = paper_pattern.subn(paper_replacement, text, count=1)
          live_pattern = re.compile(
              r'process_active_signal\(\s*&config,\s*now,\s*signal,\s*&mut risk,\s*executor,\s*&journal,\s*&mut runtime,\s*&mut open,\s*\)',
              re.S,
          )
          live_replacement = '''process_active_signal(
              now,
              signal,
              executor,
              ActiveSignalContext {
                  config: &config,
                  risk: &mut risk,
                  journal: &journal,
                  runtime: &mut runtime,
                  open: &mut open,
              },
          )'''
          text, live_count = live_pattern.subn(live_replacement, text, count=1)
          if paper_count != 1 or live_count != 1:
              raise SystemExit(f'call replacements paper={paper_count} live={live_count}')
          app.write_text(text)
          PY
          cargo fmt --all
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.rs src/app_support.rs
          git commit -m 'refactor: group active execution state'
          git push origin HEAD:polymarket-copybot-final-20260716-done
