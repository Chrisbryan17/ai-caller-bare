name: Fix Expired Restart Exposure

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

concurrency:
  group: fix-expired-restart-exposure
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - name: Count only unexpired positions as restart exposure
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/runtime.rs')
          text = path.read_text()
          replacements = [
              (
                  'runtime.validate_persisted_exposure()?;',
                  'runtime.validate_persisted_exposure(started_epoch)?;',
              ),
              (
                  'fn validate_persisted_exposure(&self) -> Result<()> {',
                  'fn validate_persisted_exposure(&self, now: i64) -> Result<()> {',
              ),
              (
                  '''            .iter()
                      .filter(|position| position.live || position.counts_global)
                      .count();'''.replace('          ', ''),
                  '''            .iter()
                      .filter(|position| position.market_end_epoch > now)
                      .filter(|position| position.live || position.counts_global)
                      .count();'''.replace('          ', ''),
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'marker not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test --test restart_safety
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime.rs
          git commit -m 'fix: ignore expired positions during restart exposure validation'
          git push origin HEAD:polymarket-copybot-final-20260716-done
