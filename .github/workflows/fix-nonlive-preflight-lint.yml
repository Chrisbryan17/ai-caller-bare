name: Fix Nonlive Preflight Lint

on:
  push:
    branches:
      - polymarket-copybot-final-20260716-done

concurrency:
  group: fix-nonlive-preflight-lint
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polymarket-copybot-final-20260716-done
      - name: Mark live-only interval as intentionally consumed in default build
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app.rs')
          text = path.read_text()
          needle = 'pub(crate) async fn run(config: AppConfig) -> Result<()> {\n'
          replacement = needle + '    #[cfg(not(feature = "live-trading"))]\n    let _ = config.preflight_ms;\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('run function marker not found')
              path.write_text(text.replace(needle, replacement, 1))
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.rs
          git commit -m 'fix: consume live-only preflight interval in default build'
          git push origin HEAD:polymarket-copybot-final-20260716-done
