name: Copybot CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format working tree
        run: cargo fmt --all
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release --all-features
      - name: Upload formatted source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copybot-ci-source
          path: |
            Cargo.toml
            Cargo.lock
            src/
            tests/
          retention-days: 3
