name: Copybot CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format working tree
        run: cargo fmt --all
      - name: Verify
        shell: bash
        run: |
          set +e
          cargo test --all-targets --all-features 2>&1 | tee test.log
          TEST_STATUS=${PIPESTATUS[0]}
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          CLIPPY_STATUS=${PIPESTATUS[0]}
          cargo build --release --all-features 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$TEST_STATUS" -ne 0 ] || [ "$CLIPPY_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ]; then
            exit 1
          fi
      - name: Upload formatted source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copybot-ci-source
          path: |
            Cargo.toml
            Cargo.lock
            src/
            tests/
            test.log
            clippy.log
            build.log
          retention-days: 3
