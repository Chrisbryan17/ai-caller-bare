[package]
name = "polymarket-copybot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Paper-first low-latency Polymarket wallet copy-trading engine"

[features]
default = []
live-trading = ["dep:polymarket_client_sdk_v2"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rust_decimal = { version = "1.37", features = ["serde"] }
rust_decimal_macros = "1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
polymarket_client_sdk_v2 = { version = "0.6", optional = true, features = ["clob"] }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.20"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
